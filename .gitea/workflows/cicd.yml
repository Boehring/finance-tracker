name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]

# Variables de entorno globales reutilizadas en todos los jobs
env:
  # Hostname del Container Registry de Gitea (sin protocolo)
  REGISTRY: gitea.central.lan
  OWNER: ${{ gitea.repository_owner }}
  REPO: ${{ gitea.repository }}
  BACKEND_IMAGE: finance-tracker-backend
  FRONTEND_IMAGE: finance-tracker-frontend
  # El runner no confía en el cert self-signed de Gitea; necesario para git fetch
  GIT_SSL_NO_VERIFY: "true"

# ─────────────────────────────────────────────
# JOB 1 – Construir el backend (TypeScript → dist/)
# ─────────────────────────────────────────────
jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check & compile
        run: npm run build

      - name: Publish to Gitea npm registry
        if: github.event_name != 'pull_request'
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          GITEA_TOKEN: ${{ secrets.RUNNER_PACKAGE_TOKEN }}
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="0.0.0-dev.$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "//gitea.central.lan/api/packages/${GITHUB_REPOSITORY_OWNER}/npm/:_authToken=${GITEA_TOKEN}" >> ~/.npmrc
          npm config set registry https://gitea.central.lan/api/packages/${GITHUB_REPOSITORY_OWNER}/npm/
          npm config set strict-ssl false
          output=$(npm publish 2>&1); rc=$?
          if [ $rc -ne 0 ]; then
            echo "$output"
            echo "$output" | grep -q "E409\|already exists" || exit 1
            echo "Version $VERSION already published, skipping."
          fi

  # ─────────────────────────────────────────────
  # JOB 2 – Construir el frontend (Vite → dist/)
  # ─────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Publish to Gitea npm registry
        if: github.event_name != 'pull_request'
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          GITEA_TOKEN: ${{ secrets.RUNNER_PACKAGE_TOKEN }}
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="0.0.0-dev.$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "//gitea.central.lan/api/packages/${GITHUB_REPOSITORY_OWNER}/npm/:_authToken=${GITEA_TOKEN}" >> ~/.npmrc
          npm config set registry https://gitea.central.lan/api/packages/${GITHUB_REPOSITORY_OWNER}/npm/
          npm config set strict-ssl false
          output=$(npm publish 2>&1); rc=$?
          if [ $rc -ne 0 ]; then
            echo "$output"
            echo "$output" | grep -q "E409\|already exists" || exit 1
            echo "Version $VERSION already published, skipping."
          fi

  # ─────────────────────────────────────────────
  # JOB 3 – Construir y publicar imágenes Docker
  # ─────────────────────────────────────────────
  build-and-push-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    # Solo en push (no en PRs) y tras compilar con éxito ambos artefactos
    if: github.event_name != 'pull_request'
    needs: [build-backend, build-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Calcular la versión/tag de las imágenes
      - name: Compute image tag
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-${SHA_SHORT}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Trust Gitea self-signed certificate
        run: |
          openssl s_client -connect gitea.central.lan:443 -showcerts </dev/null 2>/dev/null \
            | sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' \
            | sudo tee /usr/local/share/ca-certificates/gitea-central.crt > /dev/null
          sudo update-ca-certificates
          sudo mkdir -p /etc/docker/certs.d/gitea.central.lan
          sudo cp /usr/local/share/ca-certificates/gitea-central.crt \
                  /etc/docker/certs.d/gitea.central.lan/ca.crt

      # Usar driver docker (daemon nativo) para evitar el TLS stack separado de buildkitd
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # Login en el Container Registry de Gitea (compatible con OCI/Docker)
      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.RUNNER_PACKAGE_TOKEN }}

      # ── Backend image ──
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: true
          # Se etiqueta tanto con la versión calculada como con "latest" en main
          tags: |
            ${{ env.REGISTRY }}/${{ gitea.repository }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ gitea.repository }}/${{ env.BACKEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ vars.GITEA_URL }}/${{ env.REPO }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      # ── Frontend image ──
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ gitea.repository }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ gitea.repository }}/${{ env.FRONTEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ vars.GITEA_URL }}/${{ env.REPO }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

    outputs:
      version: ${{ steps.meta.outputs.version }}

  # ─────────────────────────────────────────────
  # JOB 4 – Desplegar en producción vía SSH
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push-images
    # Desplegar solo desde main/master o desde un tag de versión
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref_type == 'tag')

    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}

    steps:
      - name: Checkout (para enviar docker-compose.prod.yml)
        uses: actions/checkout@v4

      # Preparar clave SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST_DASSAULT }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Copiar el compose de producción al servidor
      - name: Copy docker-compose.prod.yml to server
        run: |
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -v \
              docker-compose.prod.yml \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST_DASSAULT }}:~/projects/finance-tracker/docker-compose.prod.yml"

      # Ejecutar el despliegue en el servidor remoto
      - name: Deploy
        env:
          VERSION: ${{ needs.build-and-push-images.outputs.version }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -v \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST_DASSAULT }}" \
              bash -s << EOF
            set -e

            cd ~/projects/finance-tracker

            # Login en el registry desde el servidor de producción
            echo "${{ secrets.RUNNER_PACKAGE_TOKEN }}" | \
              docker login ${{ env.REGISTRY }} \
                -u "${{ gitea.actor }}" \
                --password-stdin

            # Actualizar las variables de imagen en el compose
            export BACKEND_IMAGE="${{ env.REGISTRY }}/${{ gitea.repository }}/${{ env.BACKEND_IMAGE }}:${VERSION}"
            export FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ gitea.repository }}/${{ env.FRONTEND_IMAGE }}:${VERSION}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"

            # Descargar las nuevas imágenes y recrear los contenedores
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans

            # Limpieza de imágenes huérfanas
            docker image prune -f

            echo "Despliegue completado: versión ${VERSION}"
          EOF

      # Verificar que el backend responde correctamente
      - name: Health check
        run: |
          sleep 10
          curl --fail --retry 5 --retry-delay 5 \
            "${{ vars.DEPLOY_URL }}/api/health" \
            && echo "Health check OK" \
            || (echo "Health check FAILED" && exit 1)

      # Limpiar la clave SSH de la máquina del runner
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
