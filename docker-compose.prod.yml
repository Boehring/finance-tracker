services:
  backend:
    image: gitea.central.lan/boehring/finance-tracker/finance-tracker-backend:latest
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads
      - sqlite_data:/app/data
    environment:
      DATABASE_URL: file:/app/data/prod.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      PORT: 3001
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: 5242880
    ports: 
      - "3001:3001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: gitea.central.lan/boehring/finance-tracker/finance-tracker-frontend:latest
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    ports:
      - "8084:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

volumes:
  uploads:
  sqlite_data:

networks:
  app-network:
    driver: bridge
